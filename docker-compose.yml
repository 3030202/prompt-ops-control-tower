services:
  redis:
    image: redis:7-alpine
    container_name: osint_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: promptops_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  osint-radar:
    build: .
    container_name: osint_perplexity_grok_radar
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./sessions:/app/sessions
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: promptops_cloudflared
    restart: unless-stopped
    depends_on:
      - osint-radar
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token
    volumes:
      - ./secrets/cloudflare_tunnel_token:/run/secrets/cloudflare_tunnel_token:ro

volumes:
  redis_data:
  qdrant_data:
