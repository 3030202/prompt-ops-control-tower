name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile \
            prompt_ops_app.py \
            prompt_ops_mcp.py \
            publishing_studio.py \
            osint_perplexity_grok_radar.py

      - name: Run tests
        run: PYTHONPATH=. pytest -q tests/test_publishing.py tests/test_sources.py tests/test_mcp.py

      - name: Validate docker-compose config
        run: cp .env.example .env && docker compose config --quiet
