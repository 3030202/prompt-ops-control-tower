name: Deploy to Server

on:
  push:
    branches: [main]

# Только один деплой одновременно; новый push отменяет предыдущий in-progress
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Быстрая проверка синтаксиса перед деплоем ──────────────────────────
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check
        run: |
          python -m py_compile \
            prompt_ops_app.py \
            prompt_ops_mcp.py \
            publishing_studio.py \
            osint_perplexity_grok_radar.py

      - name: Run tests
        run: PYTHONPATH=. pytest -q tests/test_publishing.py tests/test_sources.py tests/test_mcp.py

      - name: Validate docker-compose config
        run: cp .env.example .env && docker compose config --quiet

  # ── 2. Деплой на сервер (только если preflight прошёл) ────────────────────
  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH with healthcheck and auto-rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.SSH_HOST }}
          username:    ${{ secrets.SSH_USER }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          port:        ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            HEALTH_URL="http://localhost:8000/health"

            echo "=== [1/5] Переходим в рабочую директорию: $DEPLOY_PATH ==="
            cd "$DEPLOY_PATH"

            echo "=== [2/5] Фиксируем текущий коммит для rollback ==="
            PREV_COMMIT=$(git rev-parse HEAD)
            PREV_SHORT=$(git rev-parse --short HEAD)
            echo "Сохранён: $PREV_SHORT"

            echo "=== [3/5] Обновляем код ==="
            git fetch origin main
            git reset --hard origin/main
            NEW_SHORT=$(git rev-parse --short HEAD)
            echo "Новый коммит: $NEW_SHORT"

            echo "=== [4/5] Пересборка и запуск (volumes не трогаем) ==="
            docker compose up -d --build --remove-orphans

            echo "=== [5/5] Healthcheck (до 60 секунд) ==="
            MAX_WAIT=60
            WAITED=0
            until curl -sf --max-time 5 "$HEALTH_URL" > /dev/null 2>&1; do
              if [ $WAITED -ge $MAX_WAIT ]; then
                echo ""
                echo "❌ HEALTHCHECK НЕ ПРОШЁЛ после ${MAX_WAIT}s"
                echo "⏪ Запускаем ROLLBACK на $PREV_SHORT ..."

                git reset --hard "$PREV_COMMIT"
                docker compose up -d --build --remove-orphans

                echo "Ждём 25s после rollback..."
                sleep 25

                if curl -sf --max-time 5 "$HEALTH_URL" > /dev/null 2>&1; then
                  echo "✅ Rollback УСПЕШЕН — сервис работает на $PREV_SHORT"
                else
                  echo "🔥 КРИТИЧНО: rollback не помог, требуется ручное вмешательство!"
                fi
                exit 1
              fi
              echo "  Ждём... ${WAITED}s / ${MAX_WAIT}s"
              sleep 5
              WAITED=$((WAITED + 5))
            done

            echo ""
            echo "╔══════════════════════════════════════════╗"
            echo "║  ✅  ДЕПЛОЙ УСПЕШЕН                      ║"
            echo "╚══════════════════════════════════════════╝"
            echo "Коммит:  $NEW_SHORT"
            echo "Сервис:  $HEALTH_URL → 200 OK"
            echo ""
            docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
