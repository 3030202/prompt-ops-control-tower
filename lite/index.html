<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="prompt-ops-api-base" content=""><title>Prompt Ops Lite</title><style>
:root{--paper:#f2f0e8;--ink:#171714;--line:#c8c4b8;--acid:#c8ec26;--blue:#116e8a;--muted:#68675f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}.shell{max-width:1160px;margin:auto;padding:24px}.mast{border-top:8px solid var(--ink);border-bottom:2px solid var(--ink);padding:18px 0;display:flex;justify-content:space-between;gap:24px;align-items:end}.mast h1{font-family:Impact,"Arial Narrow",sans-serif;text-transform:uppercase;font-size:clamp(42px,9vw,104px);line-height:.75;margin:0;letter-spacing:-.04em}.mast p{max-width:34ch;margin:0;color:var(--muted)}.tools{display:grid;grid-template-columns:1fr 260px 120px;gap:8px;margin:20px 0}input,select,button{padding:12px;border:1px solid var(--ink);background:transparent;color:var(--ink)}button{background:var(--acid);font-weight:800;cursor:pointer}.count{font-family:monospace;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}article{padding:20px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);min-height:280px}article h2{font-size:30px;line-height:1;margin:10px 0}article p{line-height:1.55}.meta{font-family:monospace;font-size:11px;text-transform:uppercase;color:var(--blue)}.mode{background:var(--acid);color:var(--ink);padding:3px 6px}.artifact{white-space:pre-wrap;background:#e7e4da;border-left:4px solid var(--blue);padding:12px;font:12px/1.5 monospace;max-height:260px;overflow:auto}a{color:var(--blue)}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}@media(max-width:760px){.mast{display:block}.mast p{margin-top:20px}.tools,.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header class="mast"><h1>Prompt<br>Ops Lite</h1><p>Публичный архив опубликованных разборов и артефактов. Никаких приватных raw-данных, ключей и локальных путей.</p></header><section class="tools"><input id="q" placeholder="Поиск по опубликованному"><select id="mode"><option value="">Все режимы</option><option>step_by_step</option><option>roast</option><option>my_take</option><option>artifact_from_source</option><option>full_editorial</option></select><button id="search">Найти</button></section><div id="count" class="count"></div><section id="grid" class="grid"></section></main><script>
const base=(window.PROMPT_OPS_API_BASE||document.querySelector('meta[name="prompt-ops-api-base"]').content||'').replace(/\/$/,'');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const p=new URLSearchParams({q:document.getElementById('q').value,mode:document.getElementById('mode').value});const r=await fetch(`${base}/api/public/feed?${p}`);const d=await r.json();document.getElementById('count').textContent=`Published objects: ${d.count}`;document.getElementById('grid').innerHTML=d.items.length?d.items.map(x=>`<article><div class="meta"><span class="mode">${esc(x.mode)}</span> / ${esc(x.published_at||'')}</div><h2>${esc(x.title)}</h2><p>${esc(x.text).replace(/\n/g,'<br>')}</p>${x.artifact_markdown?`<pre class="artifact">${esc(x.artifact_markdown)}</pre>`:''}<div class="meta">${esc(x.source_name||'')}</div>${x.telegram_link?`<p><a href="${esc(x.telegram_link)}" target="_blank">Открыть в Telegram →</a></p>`:''}</article>`).join(''):'<div class="empty">Публичных материалов пока нет.</div>'}document.getElementById('search').onclick=load;load();
</script></body></html>
